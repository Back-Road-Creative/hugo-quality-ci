name: CI

# This repository ships Node scripts, a Python package and Hugo partials, so
# CI runs all three. The Python job installs Hugo because the partial tests
# build a fixture site and read what it actually rendered.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.19', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # No `npm ci`: this package has zero dependencies on purpose, so there is
      # no lockfile to install from and the test runner is Node's own.
      - name: Run Node tests
        run: npm test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.139.0'
          extended: true

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run Python tests
        # The partial tests skip when Hugo is missing, which is right on a
        # laptop and wrong here: a skip on CI means the partials stopped being
        # tested and the run still went green. This makes it a hard error.
        env:
          HUGO_QUALITY_REQUIRE_HUGO: '1'
        run: python -m pytest -q
