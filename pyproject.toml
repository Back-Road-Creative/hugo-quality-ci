[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hugo-quality-ci"
version = "0.1.0"
description = "Pull-request quality gates for Hugo sites: front matter, content accuracy, links, accessibility and structured data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "joepetjr@gmail.com" }]
keywords = ["hugo", "static-site", "ci", "accessibility", "seo", "front-matter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
hugo-validate-frontmatter = "hugo_quality.frontmatter:main"
hugo-update-frontmatter = "hugo_quality.updater:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
